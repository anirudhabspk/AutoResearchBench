  let body=`<text class="tick" x="${(L+W-R)/2}" y="352" text-anchor="middle">Turn</text><text class="tick" x="15" y="${(T+plotB)/2}" text-anchor="middle" transform="rotate(-90 15 ${(T+plotB)/2})">${mode==="change"?"Change":"Score"}</text><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${plotB}"/>`;for(const clean of d.ticks){const yy=y(clean);body+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="tick" x="${L-8}" y="${yy+3}" text-anchor="end">${fmt(clean)}</text>`}if(d.broken){body+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${plotB}" y2="${plotB}"/><text class="tick" x="${L-8}" y="${plotB+3}" text-anchor="end">0.000</text><rect x="${L-7}" y="252" width="14" height="18" fill="var(--card)"/><path class="axis-break" d="M${L-6} 253L${L+6} 258L${L-6} 263L${L+6} 268"><title>Axis break</title></path>`}

  for(const key of ORDER){const model=task.models.find(m=>m.model===key);if(!model)continue;const rows=iterations(model),raw=curve(model,kind),vals=displayValues(model,kind),pts=[];vals.forEach((v,index)=>{const iter=rows[index]?.iteration;if(iter==null)return;if(v==null){const xx=x(iter);body+=`<path fill="none" stroke="var(--muted)" stroke-width="1.7" d="M${xx} ${unavailableY-5}L${xx+5} ${unavailableY}L${xx} ${unavailableY+5}L${xx-5} ${unavailableY}Z"><title>${esc(MODEL[key].name)} iteration ${iter}: score unavailable in Horizon</title></path><text class="tick" x="${L-8}" y="${unavailableY+3}" text-anchor="end">unavailable</text>`;pts.push(null);return}pts.push([x(iter),y(v),v,raw[index],iter])});let seg=[];const flush=()=>{if(seg.length>1){let path=`M${seg[0][0].toFixed(1)} ${seg[0][1].toFixed(1)}`;for(let i=1;i<seg.length;i++)path+=stepCurve?`L${seg[i][0].toFixed(1)} ${seg[i-1][1].toFixed(1)}L${seg[i][0].toFixed(1)} ${seg[i][1].toFixed(1)}`:`L${seg[i][0].toFixed(1)} ${seg[i][1].toFixed(1)}`;body+=`<path class="line" stroke="${MODEL[key].color}" d="${path}"/>`}seg=[]};pts.forEach(p=>{if(!p){flush();return}seg.push(p)});flush();pts.filter(Boolean).forEach(p=>{const zero=p[3]===0?", recorded score 0":"";body+=`<circle class="dot" fill="${MODEL[key].color}" cx="${p[0]}" cy="${p[1]}" r="2.8"><title>${esc(MODEL[key].name)} iteration ${p[4]}: ${mode==="change"?`change ${p[2].toFixed(4)}, raw ${p[3].toFixed(4)}`:p[3].toFixed(4)}${zero}</title></circle>`});if(rows.at(-1)?.iteration<h){const last=pts.filter(Boolean).at(-1);if(last)body+=`<line x1="${last[0]}" x2="${last[0]}" y1="${last[1]-5}" y2="${last[1]+5}" stroke="${MODEL[key].color}" stroke-width="2"><title>${esc(MODEL[key].name)} completed after ${rows.length} of ${h} iterations</title></line>`}}

}
function shortRuns(task){const h=taskHorizon(task);return task.models.map(m=>({key:m.model,last:iterations(m).at(-1)?.iteration||0,h})).filter(x=>x.last<x.h)}

function table(task){const stats=taskStats(task);let rows="";for(const key of ORDER){const s=stats.models.find(x=>x.key===key);if(!s)continue;rows+=`<tr><td>${esc(MODEL[key].name)}</td><td>${s.coverage}/${s.horizon}</td><td>${fmt(s.valAuc)}</td><td>${fmt(s.testAuc)}</td><td>${s.valAuc==null||s.testAuc==null?"·":`${s.valAuc-s.testAuc>=0?"+":""}${fmt(s.valAuc-s.testAuc)}`}</td><td>${fmt(s.selected.test)}</td><td>${s.selected.iteration??"·"}</td></tr>`}return `<details><summary>Show AUC scores</summary><div class="table-wrap"><table><thead><tr><th>Model</th><th>Turns seen</th><th>Validation AUC</th><th>Test AUC</th><th>Validation minus test</th><th>Final chosen test</th><th>Chosen turn</th></tr></thead><tbody>${rows}</tbody></table></div></details>`}
function renderTask(task){const stats=taskStats(task),aucLeader=stats.finalComplete.slice().sort((a,b)=>b.testAuc-a.testAuc)[0],finalLeader=stats.finalComplete.slice().sort((a,b)=>b.selected.test-a.selected.test)[0],short=shortRuns(task),rho=stats.finalRho==null?"not available":stats.finalRho.toFixed(2),early=short.length?`<p class="early">${short.map(x=>`${esc(MODEL[x.key].name)} ended at turn ${x.last}`).join(". ")}. We carry the last chosen checkpoint to turn 15 for AUC.</p>`:"",gap=aucLeader&&finalLeader?finalLeader.selected.test-aucLeader.selected.test:null,choice=aucLeader&&finalLeader?(gap<=1e-12?`Test AUC picks ${esc(MODEL[aucLeader.key].name)} at ${fmt(aucLeader.testAuc)}. Its final selected test score is ${fmt(aucLeader.selected.test)}, which is also the best final score.`:`Test AUC picks ${esc(MODEL[aucLeader.key].name)} at ${fmt(aucLeader.testAuc)}. Its final selected test score is ${fmt(aucLeader.selected.test)}. ${esc(MODEL[finalLeader.key].name)} has the best final score at ${fmt(finalLeader.selected.test)}, a gap of ${fmt(gap)}.`):"The comparison is not available.",comparison=`${choice} Rank agreement is ρ = ${rho}.`;return `<section class="task" id="${esc(task.name)}"><div class="task-head"><div><h2 title="${esc(task.name)}">${esc(prettyTask(task.name))}</h2><p class="task-note">${comparison}</p>${early}</div><a href="https://horizon.bespokelabs.ai/tasks/${task.task_id}">Open in Horizon</a></div><div class="charts">${chart(task,"Best validation score so far","","bestVal")}${chart(task,"Test score at the best validation checkpoint","","testAtBest")}</div>${legend(task)}<details><summary>Show scores from every turn</summary><div class="charts">${chart(task,"Validation score","","public")}${chart(task,"Test score","","private")}</div></details>${table(task)}</section>`}
function dataStatus(){let zeros=0,valZero=0,testZero=0,nonnull=0,turns=0,anyZero=0,bothZero=0,testOnly=0,valOnly=0,short=[],unavailable=[];const taskZeros={},modelZeros={};for(const task of DATA.tasks){const h=taskHorizon(task);taskZeros[task.name]=0;for(const model of task.models){modelZeros[model.model]??={zero:0,n:0};const rows=iterations(model),last=rows.at(-1)?.iteration||0;if(last<h)short.push(`${MODEL[model.model].name} on ${prettyTask(task.name)} ended at turn ${last} of ${h}.`);for(const row of rows){turns++;const val=row.public_score,test=row.private_score,v0=val===0,t0=test===0,missing=[];nonnull+=(val!=null)+(test!=null);zeros+=v0+t0;valZero+=v0;testZero+=t0;anyZero+=v0||t0;bothZero+=v0&&t0;testOnly+=!v0&&t0;valOnly+=v0&&!t0;taskZeros[task.name]+=v0+t0;modelZeros[model.model].zero+=v0+t0;modelZeros[model.model].n+=(val!=null)+(test!=null);if(val==null)missing.push("validation");if(test==null)missing.push("test");if(missing.length)unavailable.push(`${MODEL[model.model].name} on ${prettyTask(task.name)} has no ${missing.join(" or ")} score at turn ${row.iteration}.`)}}}const top=Object.entries(taskZeros).sort((a,b)=>b[1]-a[1]).slice(0,6),topCount=top.reduce((s,x)=>s+x[1],0),modelRates=Object.entries(modelZeros).sort((a,b)=>b[1].zero/b[1].n-a[1].zero/a[1].n),rate=(100*zeros/nonnull).toFixed(1);document.getElementById("data-status").innerHTML=`<div class="status-card"><strong>${rate}% of recorded turn scores are zero, so we should rerun the affected experiments.</strong><details><summary>Show data issues</summary><ul><li>${zeros} of ${nonnull.toLocaleString()} scores are zero.</li><li>${valZero} validation scores and ${testZero} test scores are zero.</li><li>${anyZero} of ${turns.toLocaleString()} turns have at least one zero. ${bothZero} have zero on both sets, ${testOnly} on test only, and ${valOnly} on validation only.</li><li>${(100*topCount/zeros).toFixed(0)}% of zeros come from six tasks: ${top.map(([name,n])=>`${esc(prettyTask(name))} (${n})`).join(", function summary(){const byModel={};ORDER.forEach(k=>byModel[k]={val:[],test:[],selected:[],pairs:[]});const taskRhos=[];for(const task of DATA.tasks){const stats=taskStats(task);if(stats.rho!=null)taskRhos.push(stats.rho);for(const s of stats.models)if(s.selected.test!=null)byModel[s.key].selected.push(s.selected.test);for(const s of stats.complete){byModel[s.key].val.push(s.valAuc);byModel[s.key].test.push(s.testAuc);byModel[s.key].pairs.push({task:task.name,val:s.valAuc,test:s.testAuc})}}const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null,rows=ORDER.map((key,index)=>{const val=mean(byModel[key].val),test=mean(byModel[key].test),selected=mean(byModel[key].selected),pairs=byModel[key].pairs;return {key,val,test,selected,relative:relativeGap(val,test),valCI:bootstrapCI(byModel[key].val,100+index),testCI:bootstrapCI(byModel[key].test,200+index),selectedCI:bootstrapCI(byModel[key].selected,250+index),relativeCI:pairedRelativeCI(pairs,300+index)}}),testRows=rows.slice().sort((a,b)=>b.test-a.test),selectedRows=rows.slice().sort((a,b)=>b.selected-a.selected),valRows=rows.slice().sort((a,b)=>b.val-a.val),gapRows=rows.slice().sort((a,b)=>a.relative-b.relative),meanRho=mean(taskRhos),rhoCI=bootstrapCI(taskRhos,919),scoreDomain=overviewDomain(rows.flatMap(r=>[{ci:r.testCI},{ci:r.selectedCI},{ci:r.valCI}])),gapDomain=overviewDomain(rows.map(r=>({ci:r.relativeCI})),true),plots=overviewPlot("Test AUC","Primary score.",testRows,"test","testCI",scoreDomain,v=>v.toFixed(2),fmt)+overviewPlot("Final selected test","Chosen by validation.",selectedRows,"selected","selectedCI",scoreDomain,v=>v.toFixed(2),fmt)+overviewPlot("Validation AUC","Score the agent sees.",valRows,"val","valCI",scoreDomain,v=>v.toFixed(2),fmt)+overviewPlot("Relative gap","Lower is better.",gapRows,"relative","relativeCI",gapDomain,v=>`${Math.round(100*v)}%`,fmtPct,true),qwen=rows.find(r=>r.key==="forge"),qwenRest=byModel.forge.pairs.filter(x=>!x.task.includes("shortest-valid")),qwenRestGap=relativeGap(mea function selectionAudit(){const rows=[],rhos=[];for(const task of DATA.tasks){const stats=taskStats(task),aucWinner=stats.finalComplete.slice().sort((a,b)=>b.testAuc-a.testAuc)[0],finalWinner=stats.finalComplete.slice().sort((a,b)=>b.selected.test-a.selected.test)[0];if(!aucWinner||!finalWinner)continue;const finalLeaders=stats.finalComplete.filter(s=>Math.abs(s.selected.test-finalWinner.selected.test)<=1e-12),gap=Math.max(0,finalWinner.selected.test-aucWinner.selected.test);rows.push({task,aucWinner,finalWinner,finalLeaders,gap});if(stats.finalRho!=null)rhos.push(stats.finalRho)}rows.sort((a,b)=>b.gap-a.gap);const gaps=rows.map(r=>r.gap),mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null,matches=rows.filter(r=>r.gap<=1e-12).length,gapCI=bootstrapCI(gaps,939),rho=mean(rhos),rhoCI=bootstrapCI(rhos,929);document.getElementById("selection-audit").innerHTML=`<h2>Does Test AUC pick the best final result?</h2><p class="summary-note">For each task, we compare the model with the highest Test AUC with the model that reaches the best final selected test score.</p><div class="summary-grid"><div class="metric-card"><strong>AUC winner reaches the best final score</strong><p class="big">${matches} of ${rows.length}</p><p>This includes ties.</p></div><div class="metric-card"><strong>Mean final score gap</strong><p class="big">${fmt(mean(gaps))}</p><p>The 95% interval is ${fmt(gapCI[0])} to ${fmt(gapCI[1])}.</p></div><div class="metric-card"><strong>Rank agreement</strong><p class="big">ρ = ${rho==null?"·":rho.toFixed(2)}</p><p>Mean across tasks. The 95% interval is ${rhoCI[0]==null?"not available":`${rhoCI[0].toFixed(2)} to ${rhoCI[1].toFixed(2)}`}.</p></div></div><div class="table-wrap"><table class="selection-table"><thead><tr><th>Task</th><th>Test AUC choice</th><th>Its final score</th><th>Best final choice</th><th>Gap</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(prettyTask(r.task.name))}</td><td>${esc(MODEL[r.aucWinner.key].name)} (${fmt(r.aucWinner.testAuc)})</td><
